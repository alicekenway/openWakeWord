[sdk]
model_dir = /mnt/users/jinyang_wang/WUW/SDK_test/0.0.1/model
build_dir = /mnt/users/jinyang_wang/WUW/SDK_test/0.0.1/build
output_dir = /mnt/users/jinyang_wang/WUW/SDK_test/0.0.1/full_expts8_sdk_run

[evaluation]
sample_rate = 16000
audio_window_seconds = 5.12
audio_window_stride_seconds = 2.56

[slurm]
# Each test set gets min(workers_per_test, number_of_audio_files) workers.
# Test sets run sequentially; files within one set are distributed by modulo.
workers_per_test = 100
max_concurrent_per_test = 100
poll_seconds = 20
sbatch_args = --partition=cpu --cpus-per-task=1 --mem=2G --time=02:00:00

[summary]
enabled = yes
# The fixed stage-2 threshold and debounce come from model_dir/sdk_defaults.json.
output_json = ${sdk:output_dir}/full_condition_comparison.json
output_report = ${sdk:output_dir}/FULL_CONDITION_COMPARISON.md

[testing.common]
expected_input = JSONL audio manifest
negative_mode = sliding_window

[testing.positive_wuw_audio_car_related]
input_jsonl = /mnt/users/jinyang_wang/WUW/test/expts8_full/data/manifests/positive_wuw_audio/car_related.jsonl
expected_label = 1

