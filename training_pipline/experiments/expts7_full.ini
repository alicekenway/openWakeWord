[main]
experiment_dir = /mnt/users/jinyang_wang/WUW/test/expts7_full
data_dir = /mnt/users/jinyang_wang/WUW/test/data
sample_rate = 16000
seed = 1337
pipeline_checkpoint_dir = ${main:experiment_dir}/pipeline_state
execution_mode = slurm
slurm_array_tasks = 50
slurm_cpu_sbatch_args = --partition=cpu --mem=8G --cpus-per-task=1

[steps]
steps = [testing.positive_wuw_audio_car_related, testing.positive_wuw_audio_fir, testing.positive_wuw_audio_car_related_fir, testing.positive_wuw_audio_ordinary, testing.positive_wuw_audio_clean, testing.positive_hei_siri_sampled_car_related, testing.positive_hei_siri_sampled_fir, testing.positive_hei_siri_sampled_car_related_fir, testing.positive_hei_siri_sampled_ordinary, testing.positive_hei_siri_sampled_clean, testing.negative_cosyvoice_car_related, testing.negative_cosyvoice_fir, testing.negative_cosyvoice_car_related_fir, testing.negative_cosyvoice_ordinary, testing.negative_cosyvoice_clean, testing.negative_gigaspeech_m_car_related, testing.negative_gigaspeech_m_fir, testing.negative_gigaspeech_m_car_related_fir, testing.negative_gigaspeech_m_ordinary, testing.negative_gigaspeech_m_clean], summary

[testing.common]
structure = ctc_wac
model = /mnt/users/jinyang_wang/WUW/train/expts7/hardneg/trained_model/batch8_clean25_fir20_hardneg.onnx
stage1_model = /mnt/users/jinyang_wang/WUW/model/base_expts4/output/stage1-wuw.int8.onnx
stage1_contract = /mnt/users/jinyang_wang/WUW/model/base_expts4/output/stage1-wuw.contract.json
keywords = /mnt/users/jinyang_wang/WUW/train/expts3/thresholds.json
stage1_device = cpu
stage1_gate_score = normalized_confidence
ctc_proposal_score_floor = -3
competitor_beam_size = 16
competitor_token_prune = 8
candidate_pre_margin_frames = 3
candidate_post_margin_frames = 0
window_seconds = 2.56
window_count = 2
audio_window_seconds = 5.12
audio_window_stride_seconds = 2.56
vad_model = /mnt/users/jinyang_wang/WUW/model/silero/silero_vad.onnx
vad_threshold = 0.5
vad_padding_ms = 100
vad_threads = 1

