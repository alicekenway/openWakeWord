[main]
experiment_dir = /mnt/users/jinyang_wang/WUW/train/expts5
model_name = batch8_clean25_fir_balanced_car_noise
sample_rate = 16000
seed = 1337
pipeline_checkpoint_dir = ${main:experiment_dir}/pipeline_state
execution_mode = local

[steps]
steps = train, export

[ctc_stage1]
keywords = /mnt/users/jinyang_wang/WUW/train/expts3/thresholds.json

[feature.positive_wuw_audio_train]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/positive_wuw_audio/train.npy
label = 1
split = train

[feature.positive_wuw_audio_val]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/positive_wuw_audio/val.npy
label = 1
split = dev

[feature.negative_non_wuw_audio_train]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/negative_non_wuw_audio/train.npy
label = 0
split = train

[feature.negative_non_wuw_audio_val]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/negative_non_wuw_audio/val.npy
label = 0
split = dev

[feature.negative_car_control_train]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/negative_car_control/train.npy
label = 0
split = train

[feature.negative_car_control_val]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/negative_car_control/val.npy
label = 0
split = dev

[feature.negative_cv_en_train_phoneme_train]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/negative_cv-en-train_phoneme/train.npy
label = 0
split = train

[feature.negative_cv_en_train_phoneme_val]
output_file = /mnt/users/jinyang_wang/WUW/train/features/batch_8/features/negative_cv-en-train_phoneme/val.npy
label = 0
split = dev

[train]
structure = ctc_wac
keywords = ${ctc_stage1:keywords}
stage1_gate_score = normalized_confidence
ctc_proposal_score_floor = -3
train = feature.positive_wuw_audio_train, feature.negative_non_wuw_audio_train, feature.negative_car_control_train, feature.negative_cv_en_train_phoneme_train
dev = feature.positive_wuw_audio_val, feature.negative_non_wuw_audio_val, feature.negative_car_control_val, feature.negative_cv_en_train_phoneme_val

batch.feature.positive_wuw_audio_train = 96
batch.feature.negative_non_wuw_audio_train = 32
batch.feature.negative_car_control_train = 32
batch.feature.negative_cv_en_train_phoneme_train = 32

length_bucket_width_frames = 8
steps = 5000
phase_step_ratios = [1.0, 0.1]
phase_learning_rates = [0.0003, 0.00003]

wac.frame_hidden = 128
wac.frame_layers = 3
wac.head_hidden = 128
wac.dropout = 0.1
wac.temporal_model = mlp
wac.pooling = mean_max
wac.use_winner_onehot = yes
balance_winners = no

max_negative_weight = 1
require_cuda = yes
mixed_precision = yes
resume = no
checkpoint_interval_steps = 500
validation_interval_steps = 500
keep_checkpoints = 3
model_checkpoint_dir = ${main:experiment_dir}/model_checkpoints
output_model = ${main:experiment_dir}/trained_model/${main:model_name}.pt
output_summary = ${main:experiment_dir}/trained_model/training_summary.json
training_log_file = ${main:experiment_dir}/trained_model/training.jsonl

[export]
input_model = ${train:output_model}
output_model = ${main:experiment_dir}/trained_model/${main:model_name}.onnx
opset_version = 13
verify = yes
