fir_probability = 0.0
output_dir = /mnt/users/jinyang_wang/WUW/test/data/augmented/positive_wuw_audio/car_related
output_manifest = /mnt/users/jinyang_wang/WUW/test/data/manifests/positive_wuw_audio/car_related.jsonl
rounds = ${augmentation:rounds}
snr_low = ${augmentation:snr_low}
snr_high = ${augmentation:snr_high}
