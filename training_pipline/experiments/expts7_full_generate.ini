[main]
experiment_dir = /mnt/users/jinyang_wang/WUW/test/expts7_full
data_dir = /mnt/users/jinyang_wang/WUW/test/data
sample_rate = 16000
seed = 1337
pipeline_checkpoint_dir = ${main:experiment_dir}/generation_pipeline_state
execution_mode = slurm
slurm_array_tasks = 200
slurm_cpu_sbatch_args = --partition=cpu --mem=30G --cpus-per-task=1

[steps]
steps = [augment.positive_wuw_audio_car_related, augment.positive_wuw_audio_fir, augment.positive_wuw_audio_car_related_fir, augment.positive_wuw_audio_ordinary, augment.positive_wuw_audio_clean, augment.positive_hei_siri_sampled_car_related, augment.positive_hei_siri_sampled_fir, augment.positive_hei_siri_sampled_car_related_fir, augment.positive_hei_siri_sampled_ordinary, augment.positive_hei_siri_sampled_clean, augment.negative_cosyvoice_car_related, augment.negative_cosyvoice_fir, augment.negative_cosyvoice_car_related_fir, augment.negative_cosyvoice_ordinary, augment.negative_cosyvoice_clean, augment.negative_gigaspeech_m_car_related, augment.negative_gigaspeech_m_fir, augment.negative_gigaspeech_m_car_related_fir, augment.negative_gigaspeech_m_ordinary, augment.negative_gigaspeech_m_clean]

[augmentation]
car_noise_jsonl = /mnt/users/jinyang_wang/open_source_data_collection/ENX/background_merged/car_related_metadata.jsonl
ordinary_noise_jsonl = /mnt/users/jinyang_wang/open_source_data_collection/ENX/background_merged/ordinary_noise_metadata.jsonl
fir_list = /mnt/users/jinyang_wang/open_source_data_collection/ENX/v_class_impulse_responses_16k_mouth_to_standard_mic/fir.list
rounds = 1
snr_low = 10
snr_high = 30
artificial_probability = 0.0
random_gain_db = 0.0
placement = end
full_mode_window_seconds = 30
workers = 1

[augment.positive_wuw_audio_car_related]
input_jsonl = /mnt/users/jinyang_wang/TTS_cosyvoice/generation/ENX/batch_6/wuw_audio/metadata.jsonl
