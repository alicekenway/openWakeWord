[main]
experiment_dir = /mnt/users/jinyang_wang/WUW/train/features/batch_10
# Reuse the source manifests; all generated artifacts remain isolated in batch_10.
input_data_dir = /mnt/users/jinyang_wang/WUW/train/features/batch_1/input_data
model_name = batch_10_fir100_balanced_car_noise
sample_rate = 16000
ctc_context_seconds = 2.56
# Two base windows provide a 5.12 s maximum CTC candidate/search range.
ctc_window_count = 2
# Keep augmented short clips variable length: sampled leading background plus source.
ctc_leading_context_seconds_range = [0, 2.0]
seed = 1337
pipeline_checkpoint_dir = ${main:experiment_dir}/pipeline_state
execution_mode = slurm
slurm_array_tasks = 200
slurm_cpu_sbatch_args = --partition=cpu --mem=30G --cpus-per-task=1
# Keep background recordings source-disjoint between model development and test.
train_noise_jsonl = [{"path": "/mnt/users/jinyang_wang/open_source_data_collection/ENX/background_merged/car_related_metadata_train.jsonl", "weight": 1.0}, {"path": "/mnt/users/jinyang_wang/open_source_data_collection/ENX/background_merged/ordinary_noise_metadata_train.jsonl", "weight": 1.0}]
test_noise_jsonl = [{"path": "/mnt/users/jinyang_wang/open_source_data_collection/ENX/background_merged/car_related_metadata_test.jsonl", "weight": 1.0}, {"path": "/mnt/users/jinyang_wang/open_source_data_collection/ENX/background_merged/ordinary_noise_metadata_test.jsonl", "weight": 1.0}]

[steps]
steps =
    [augment.positive_wuw_audio_train, augment.positive_wuw_audio_val, augment.positive_wuw_audio_clean_test, augment.positive_wuw_audio_noise_test, augment.positive_wuw_audio_fir_test, augment.negative_non_wuw_audio_train, augment.negative_non_wuw_audio_val, augment.negative_non_wuw_audio_clean_test, augment.negative_non_wuw_audio_noise_test, augment.negative_non_wuw_audio_fir_test, augment.negative_car_control_train, augment.negative_car_control_val, augment.negative_car_control_clean_test, augment.negative_car_control_noise_test, augment.negative_car_control_fir_test, augment.negative_cv_en_train_phoneme_train, augment.negative_cv_en_train_phoneme_val, augment.negative_cv_en_train_phoneme_clean_test, augment.negative_cv_en_train_phoneme_noise_test, augment.negative_cv_en_train_phoneme_fir_test],
    [feature.positive_wuw_audio_train, feature.positive_wuw_audio_val, feature.negative_non_wuw_audio_train, feature.negative_non_wuw_audio_val, feature.negative_car_control_train, feature.negative_car_control_val, feature.negative_cv_en_train_phoneme_train, feature.negative_cv_en_train_phoneme_val]

[ctc_stage1]
model = /mnt/users/jinyang_wang/WUW/model/base_expts4/output/stage1-wuw.int8.onnx
contract = /mnt/users/jinyang_wang/WUW/model/base_expts4/output/stage1-wuw.contract.json
# units.txt defines the CTC vocabulary. This JSON contains the keyword token-id sequences built from it.
keyword_tokens = /mnt/users/jinyang_wang/WUW/train/preprocess/wenet_ctc_keyword_tokens_open_homepage.json
device = cpu
candidate_pre_margin_frames = 3
candidate_post_margin_frames = 0
candidate_search = forced_keyword
competitor_beam_size = 16
competitor_token_prune = 8

[augment.positive_wuw_audio_train]
input_jsonl = ${main:input_data_dir}/positive_wuw_audio/train.jsonl
noise_jsonl = ${main:train_noise_jsonl}
background_probability = 1.0
fir_list = /mnt/users/jinyang_wang/open_source_data_collection/ENX/v_class_impulse_responses_16k_mouth_to_standard_mic/fir.list
fir_probability = 1.0
output_dir = ${main:experiment_dir}/augmented/positive_wuw_audio/train
output_manifest = ${main:experiment_dir}/augmented/positive_wuw_audio/train.jsonl
rounds = 1
snr_low = 10
snr_high = 30
artificial_probability = 0.0
random_gain_db = 0.0
placement = end
ctc_context = yes
window_seconds = ${main:ctc_context_seconds}
window_count = ${main:ctc_window_count}
leading_context_seconds_range = ${main:ctc_leading_context_seconds_range}
long_audio_mode = filter
workers = 1

[augment.positive_wuw_audio_val]
input_jsonl = ${main:input_data_dir}/positive_wuw_audio/val.jsonl
