[main]
experiment_dir = /mnt/users/jinyang_wang/WUW/train/expts4
input_data_dir = /mnt/users/jinyang_wang/WUW/train/features/batch_1/input_data
sample_rate = 16000
seed = 1337
pipeline_checkpoint_dir = ${main:experiment_dir}/per_source_test_pipeline_state
execution_mode = slurm
slurm_array_tasks = 50
slurm_cpu_sbatch_args = --partition=cpu --mem=8G --cpus-per-task=1

[steps]
